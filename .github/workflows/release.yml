name: Release

# Triggered by a version tag. Creating and pushing the tag is the only manual
# step: the workflow builds, packages and publishes the archives.
#
#   git tag -s v1.0.0 -m "anonify 1.0.0" && git push origin v1.0.0
#
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build (glibc, both binaries)
        run: cargo build --release --locked --bins

      # A fully static binary for systems without a matching glibc. It still
      # needs `nft`, `tor`, `ip` and `wg-quick` at runtime: the engine talks to
      # the kernel and to those tools, it does not embed them.
      - name: Build (static musl, engine only)
        run: cargo build --release --locked --bin anonify --target x86_64-unknown-linux-musl

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          tar -C target/release -czf "dist/anonify-${version}-x86_64-linux-gnu.tar.gz" anonify anonify-browser
          tar -C target/x86_64-unknown-linux-musl/release -czf "dist/anonify-${version}-x86_64-linux-musl.tar.gz" anonify
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS-linux)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*

  debian:
    name: Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built inside Debian trixie so the package, its dependencies and the
      # lintian run match the distribution it targets, not the runner's.
      - name: Build .deb
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm \
            -v "$PWD":/src:ro \
            -v "$PWD/dist":/out \
            debian:trixie bash -c '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                build-essential ca-certificates cargo debhelper dpkg-dev fakeroot git rustc lintian
              cp -a /src /work && cd /work
              ./packaging/vendor.sh
              cp -r packaging/debian debian
              chmod +x debian/rules
              dpkg-buildpackage -us -uc -b
              cp /anonify_*.deb /anonify_*.changes /anonify_*.buildinfo /out/
              lintian /out/anonify_*.changes'

      - uses: actions/upload-artifact@v4
        with:
          name: dist-deb
          path: dist/*

  portable:
    name: Portable anonify-browser (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Only the portable surface is built here. The Linux engine is not part
      # of this job (see docs/platforms.md for why it has no 1:1 port).
      - name: Build anonify-browser
        run: cargo build --release --locked --bin anonify-browser

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          if [ "${RUNNER_OS}" = "Windows" ]; then
            target="anonify-browser-${version}-x86_64-windows.zip"
            (cd target/release && 7z a "../../dist/${target}" anonify-browser.exe >/dev/null)
            (cd dist && sha256sum "${target}" > "${target}.sha256")
          else
            target="anonify-browser-${version}-x86_64-macos.tar.gz"
            tar -C target/release -czf "dist/${target}" anonify-browser
            (cd dist && shasum -a 256 "${target}" > "${target}.sha256")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [linux, debian, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -l dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "anonify ${GITHUB_REF_NAME#v}" \
            --generate-notes

  # Refreshes the apt repository served from GitHub Pages. The signing key
  # lives in the APT_SIGNING_KEY secret; without it the job fails loudly
  # instead of publishing an unsigned repository.
  apt:
    name: Publish apt repository
    needs: [debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-deb
          path: deb

      - name: Build signed repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$APT_SIGNING_KEY" || { echo "::error::APT_SIGNING_KEY secret is not set"; exit 1; }
          mkdir -p pub
          docker run --rm \
            -v "$PWD":/src:ro \
            -v "$PWD/deb":/debs:ro \
            -v "$PWD/pub":/pub \
            -e "APT_SIGNING_KEY=$APT_SIGNING_KEY" \
            debian:trixie bash -c '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends apt-utils gnupg
              bash /src/packaging/apt-repo.sh /debs /pub'
          cp packaging/apt/index.html pub/index.html
          touch pub/.nojekyll

      - name: Push to gh-pages
        run: |
          set -euo pipefail
          cd pub
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(apt): publish ${GITHUB_REF_NAME#v}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
