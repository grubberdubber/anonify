[package]
name = "anonify"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Temporary, reversible network privacy hardening for Linux (portable browser profile for Windows/macOS)"
license = "GPL-3.0-only"
repository = "https://github.com/grubberdubber/anonify"
readme = "README.md"
keywords = ["privacy", "anonymity", "tor", "linux", "cli"]
categories = ["command-line-utilities"]
# Packaging trees, vendored crates and CI files do not belong in the crate
# tarball published to crates.io.
exclude = [
    "/.github",
    "/dist",
    "/packaging",
    "/snap",
    "/tests",
    "/vendor",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
libc = "0.2"
zeroize = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
codegen-units = 1
